<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waterfall Debug Tool</title>
    
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <script src="broadcast-session-tracker.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #0a192f;
            color: #64ffda;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #172a46;
            padding: 20px;
            border-radius: 10px;
        }
        .debug-info {
            background: #1e3a5f;
            border: 1px solid #64ffda;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .success { border-color: #28a745; background: #1a4d2e; }
        .error { border-color: #dc3545; background: #4d1a1a; }
        .warning { border-color: #ffc107; background: #4d3d1a; }
        button {
            background: #64ffda;
            color: #0a192f;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover { background: #4fd1c7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Waterfall Debug Tool</h1>
        <p>Diagnosing issues with waterfallconcept44.html</p>
        
        <button onclick="checkAuth()">Check Authentication</button>
        <button onclick="checkScripts()">Check Scripts</button>
        <button onclick="testWaterfallAccess()">Test Waterfall Access</button>
        <button onclick="clearAuth()">Clear Auth & Restart</button>
        
        <div id="debug-output"></div>
    </div>

    <script>
        let debugOutput = [];
        
        function addDebugMessage(type, message) {
            const timestamp = new Date().toLocaleTimeString();
            debugOutput.push(`[${timestamp}] ${type}: ${message}`);
            updateDebugDisplay();
        }
        
        function updateDebugDisplay() {
            const output = document.getElementById('debug-output');
            output.innerHTML = debugOutput.map(msg => {
                let className = '';
                if (msg.includes('ERROR')) className = 'error';
                else if (msg.includes('WARN')) className = 'warning';
                else if (msg.includes('✅')) className = 'success';
                
                return `<div class="debug-info ${className}">${msg}</div>`;
            }).join('');
        }
        
        function checkAuth() {
            addDebugMessage('INFO', '🔐 Checking authentication status...');
            
            try {
                // Check sessionStorage
                const authData = JSON.parse(sessionStorage.getItem('waterfallAuth') || '{}');
                addDebugMessage('INFO', `SessionStorage auth: ${JSON.stringify(authData, null, 2)}`);
                
                if (authData.authenticated) {
                    addDebugMessage('INFO', `✅ User authenticated: ${authData.email} (${authData.role})`);
                    addDebugMessage('INFO', `Login time: ${new Date(authData.loginTime).toLocaleString()}`);
                    addDebugMessage('INFO', `Session expires: ${new Date(authData.expiresAt).toLocaleString()}`);
                } else {
                    addDebugMessage('ERROR', '❌ User not authenticated');
                }
                
                // Check localStorage
                const activeSession = localStorage.getItem('waterfallActiveSession');
                addDebugMessage('INFO', `LocalStorage session: ${activeSession || 'None'}`);
                
            } catch (error) {
                addDebugMessage('ERROR', `❌ Auth check failed: ${error.message}`);
            }
        }
        
        function checkScripts() {
            addDebugMessage('INFO', '📜 Checking script loading...');
            
            // Check Firebase
            addDebugMessage('INFO', `Firebase: ${typeof firebase !== 'undefined' ? '✅ Loaded' : '❌ Missing'}`);
            addDebugMessage('INFO', `FirebaseConfig: ${typeof firebaseConfig !== 'undefined' ? '✅ Loaded' : '❌ Missing'}`);
            
            if (typeof firebaseConfig !== 'undefined') {
                addDebugMessage('INFO', `Firebase ready: ${firebaseConfig.isReady() ? '✅ Yes' : '❌ No'}`);
            }
            
            // Check Session Tracker
            addDebugMessage('INFO', `BroadcastSessionTracker: ${typeof BroadcastSessionTracker !== 'undefined' ? '✅ Loaded' : '❌ Missing'}`);
            
            // Check for common errors
            if (typeof console !== 'undefined' && console.error) {
                addDebugMessage('INFO', '📋 Check browser console for additional errors');
            }
        }
        
        function testWaterfallAccess() {
            addDebugMessage('INFO', '🌊 Testing waterfall page access...');
            
            try {
                // Simulate the authentication check from waterfallconcept44.html
                const authData = JSON.parse(sessionStorage.getItem('waterfallAuth') || '{}');
                
                if (!authData.authenticated) {
                    addDebugMessage('ERROR', '❌ Would redirect to index.html - not authenticated');
                    return;
                }
                
                addDebugMessage('INFO', '✅ Authentication check passed');
                
                // Check if user has access
                if (authData.role === 'admin') {
                    addDebugMessage('INFO', '✅ Admin access - can view admin dashboard');
                } else {
                    addDebugMessage('INFO', '✅ User access - normal features available');
                }
                
                // Test session tracker
                if (typeof BroadcastSessionTracker !== 'undefined') {
                    addDebugMessage('INFO', '✅ Session tracker available');
                    
                    try {
                        const tracker = new BroadcastSessionTracker();
                        const debugInfo = tracker.getDebugInfo();
                        addDebugMessage('INFO', `Session mode: ${debugInfo.mode}`);
                    } catch (error) {
                        addDebugMessage('ERROR', `❌ Session tracker error: ${error.message}`);
                    }
                } else {
                    addDebugMessage('WARN', '⚠️ Session tracker not available');
                }
                
                addDebugMessage('INFO', '🎉 Waterfall page should load correctly');
                
            } catch (error) {
                addDebugMessage('ERROR', `❌ Waterfall access test failed: ${error.message}`);
            }
        }
        
        function clearAuth() {
            addDebugMessage('INFO', '🧹 Clearing authentication data...');
            
            try {
                sessionStorage.removeItem('waterfallAuth');
                localStorage.removeItem('waterfallActiveSession');
                
                // Clear any other session data
                const keys = Object.keys(localStorage);
                keys.forEach(key => {
                    if (key.startsWith('session_') || key.includes('waterfall')) {
                        localStorage.removeItem(key);
                        addDebugMessage('INFO', `Removed: ${key}`);
                    }
                });
                
                addDebugMessage('INFO', '✅ Authentication cleared');
                addDebugMessage('INFO', '🔄 You can now go back to index.html and login again');
                
                setTimeout(() => {
                    if (confirm('Redirect to login page?')) {
                        window.location.href = 'index.html';
                    }
                }, 2000);
                
            } catch (error) {
                addDebugMessage('ERROR', `❌ Clear auth failed: ${error.message}`);
            }
        }
        
        // Auto-run checks on load
        window.addEventListener('load', function() {
            addDebugMessage('INFO', '🚀 Waterfall Debug Tool loaded');
            checkAuth();
            checkScripts();
        });
    </script>
</body>
</html>
