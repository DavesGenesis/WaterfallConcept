<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Insurance Calculator - Genesis Advisory</title>
    
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="broadcast-session-tracker.js"></script>
    
    <!-- Authentication Check -->
    <script>
        try {
            const authData = JSON.parse(sessionStorage.getItem('waterfallAuth') || '{}');
            if (!authData.authenticated) {
                window.location.href = 'index.html';
            }
        } catch (error) {
            window.location.href = 'index.html';
        }
    </script>
    
    <!-- Protection Scripts -->
    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && e.keyCode === 73) || 
                (e.ctrlKey && e.shiftKey && e.keyCode === 74) || 
                (e.ctrlKey && e.shiftKey && e.keyCode === 67) || 
                (e.ctrlKey && e.keyCode === 85) || 
                (e.ctrlKey && e.keyCode === 83)) {
                e.preventDefault();
                return false;
            }
        });

        (function() {
            const threshold = 160;
            let devtools = {open: false};
            
            setInterval(function() {
                if (window.outerWidth - window.innerWidth > threshold || 
                    window.outerHeight - window.innerHeight > threshold) {
                    if (!devtools.open) {
                        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a192f;color:#64ffda;font-family:Montserrat,sans-serif;font-size:24px;text-align:center;padding:20px;">⚠️ Developer Tools detected. Please close it to continue.</div>';
                    }
                    devtools.open = true;
                } else {
                    devtools.open = false;
                }
            }, 500);
        })();

        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
            return false;
        });

        document.addEventListener('copy', function(e) {
            e.preventDefault();
            return false;
        });
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* DCAtools Dark Theme */
        :root {
            --bg-primary: #0a192f;
            --bg-card: #172a46;
            --bg-card-darker: #111e35;
            --accent: #64ffda;
            --accent-darker: #4ecdb8;
            --text-primary: #e2e8f0;
            --text-secondary: #a8b2c1;
            --border-color: #2d3748;
            --axa-blue: #0288d1;
            --man-green: #059669;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: var(--bg-card);
            border-bottom: 2px solid var(--border-color);
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-title h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-title .highlight {
            color: var(--accent);
        }

        .back-button {
            padding: 0.75rem 1.25rem;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .back-button:hover {
            background: var(--accent-darker);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(100, 255, 218, 0.3);
        }

        /* Tab Navigation */
        .tab-nav {
            background: var(--bg-card);
            padding: 1rem 2rem;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-nav-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            gap: 1rem;
        }

        .tab-button {
            flex: 1;
            padding: 1rem 2rem;
            background: var(--bg-card-darker);
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .tab-button:hover:not(:disabled) {
            background: var(--bg-card);
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(100, 255, 218, 0.3);
        }

        .tab-button.axa.active {
            background: var(--axa-blue);
            border-color: var(--axa-blue);
            box-shadow: 0 4px 12px rgba(2, 136, 209, 0.3);
        }

        .tab-button.man.active {
            background: var(--man-green);
            border-color: var(--man-green);
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        .tab-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Calculator Frame */
        .calculator-frame {
            width: 100%;
            height: calc(100vh - 140px);
            border: none;
            display: none;
        }

        .calculator-frame.active {
            display: block;
        }

        /* Coming Soon Message */
        .coming-soon {
            display: none;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .coming-soon.active {
            display: block;
        }

        .coming-soon-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .coming-soon h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .coming-soon p {
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                gap: 1rem;
            }

            .header-title h1 {
                font-size: 1.25rem;
            }

            .tab-nav-container {
                flex-direction: column;
            }

            .tab-button {
                width: 100%;
            }

            .calculator-frame {
                height: calc(100vh - 200px);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="header-title">
                <div style="font-size: 2rem;">🏥</div>
                <h1>Health Insurance <span class="highlight">Calculator</span></h1>
            </div>
            <button class="back-button" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-left"></i>
                Back to Dashboard
            </button>
        </div>
    </header>

    <!-- Tab Navigation -->
    <div class="tab-nav">
        <div class="tab-nav-container">
            <button class="tab-button axa active" onclick="switchTab('axa')">
                🏥 AXA Health
            </button>
            <button class="tab-button man" onclick="switchTab('man')">
                💚 Manulife Health
            </button>
            <button class="tab-button" disabled>
                ➕ More Coming Soon
            </button>
        </div>
    </div>

    <!-- Calculator Frames -->
    <iframe id="axa-frame" class="calculator-frame active" src="axa-health-calculator-dark.html"></iframe>
    <iframe id="man-frame" class="calculator-frame" src="manulife-health-calculator-dark.html"></iframe>
    
    <!-- Coming Soon Message -->
    <div id="coming-soon" class="coming-soon">
        <div class="coming-soon-icon">🚧</div>
        <h2>More Calculators Coming Soon</h2>
        <p>We're working on adding more health insurance calculators. Stay tuned!</p>
    </div>

    <script>
        // Tab Switching Logic
        function switchTab(tab) {
            // Hide all frames
            document.getElementById('axa-frame').classList.remove('active');
            document.getElementById('man-frame').classList.remove('active');
            document.getElementById('coming-soon').classList.remove('active');
            
            // Deactivate all buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected content and activate button
            if (tab === 'axa') {
                document.getElementById('axa-frame').classList.add('active');
                document.querySelector('.tab-button.axa').classList.add('active');
            } else if (tab === 'man') {
                document.getElementById('man-frame').classList.add('active');
                document.querySelector('.tab-button.man').classList.add('active');
            }
        }

        // Log successful load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Health Insurance Calculator loaded');
            const authData = JSON.parse(sessionStorage.getItem('waterfallAuth') || '{}');
            console.log('User:', authData.email || 'Unknown');
        });
    </script>
</body>
</html>
