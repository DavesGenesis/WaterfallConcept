<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Test Tool</title>
    
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="broadcast-session-tracker.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #0a192f;
            color: #64ffda;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #172a46;
            padding: 20px;
            border-radius: 10px;
        }
        .session-info {
            background: #1e3a5f;
            border: 1px solid #64ffda;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        button {
            background: #64ffda;
            color: #0a192f;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover { background: #4fd1c7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Session Test Tool</h1>
        <p>Check if sessions are being stored and retrieved correctly</p>
        
        <button onclick="checkAllSessions()">Check All Sessions</button>
        <button onclick="simulateFerryLogin()">Simulate Ferry Login</button>
        <button onclick="checkFirebase()">Check Firebase</button>
        <button onclick="clearAllSessions()">Clear All Sessions</button>
        
        <div id="session-output"></div>
    </div>

    <script>
        function addOutput(message) {
            const output = document.getElementById('session-output');
            const div = document.createElement('div');
            div.className = 'session-info';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }
        
        async function checkAllSessions() {
            addOutput('🔍 Checking all active sessions...');
            
            // Check localStorage sessions
            addOutput('\n📱 LocalStorage Sessions:');
            const localSessions = getLocalStorageSessions();
            if (localSessions.length > 0) {
                localSessions.forEach((session, index) => {
                    addOutput(`${index + 1}. ${session.email} (${session.role}) - ${session.browser} - Last seen: ${new Date(session.lastSeen).toLocaleTimeString()}`);
                });
            } else {
                addOutput('No localStorage sessions found');
            }
            
            // Check Firebase sessions
            if (typeof BroadcastSessionTracker !== 'undefined') {
                try {
                    addOutput('\n🔥 Firebase Sessions:');
                    const tracker = new BroadcastSessionTracker();
                    
                    // Wait for Firebase to initialize
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    
                    const firebaseSessions = await tracker.getAllActiveSessions();
                    if (firebaseSessions.length > 0) {
                        firebaseSessions.forEach((session, index) => {
                            addOutput(`${index + 1}. ${session.email} (${session.role}) - ${session.browser} - Last seen: ${new Date(session.lastSeen).toLocaleTimeString()}`);
                        });
                    } else {
                        addOutput('No Firebase sessions found');
                    }
                } catch (error) {
                    addOutput(`❌ Firebase session check failed: ${error.message}`);
                }
            } else {
                addOutput('❌ BroadcastSessionTracker not available');
            }
        }
        
        function getLocalStorageSessions() {
            const sessions = [];
            const sessionTimeout = 5 * 60 * 1000; // 5 minutes
            
            // Check global session list
            const globalList = localStorage.getItem('globalSessionList');
            if (globalList) {
                try {
                    const data = JSON.parse(globalList);
                    const validSessions = (data.sessions || []).filter(session => {
                        return session && session.lastSeen && 
                               (Date.now() - session.lastSeen < sessionTimeout);
                    });
                    sessions.push(...validSessions);
                } catch (e) {
                    addOutput('Error parsing global session list');
                }
            }
            
            // Check individual session keys
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('session_')) {
                    try {
                        const session = JSON.parse(localStorage.getItem(key));
                        if (session && session.lastSeen && 
                            (Date.now() - session.lastSeen < sessionTimeout)) {
                            // Avoid duplicates
                            if (!sessions.find(s => s.email === session.email)) {
                                sessions.push(session);
                            }
                        }
                    } catch (e) {
                        addOutput(`Error parsing session: ${key}`);
                    }
                }
            }
            
            return sessions;
        }
        
        async function simulateFerryLogin() {
            addOutput('🧪 Simulating Ferry login...');
            
            if (typeof BroadcastSessionTracker !== 'undefined') {
                try {
                    const tracker = new BroadcastSessionTracker();
                    
                    const sessionId = tracker.startSession({
                        email: 'ferry1112@gmail.com',
                        name: 'Ferry User',
                        role: 'user',
                        deviceFingerprint: 'test-device-' + Date.now(),
                        location: 'Test Location'
                    });
                    
                    addOutput(`✅ Ferry session started: ${sessionId}`);
                    addOutput('Wait 5 seconds then check sessions again...');
                    
                } catch (error) {
                    addOutput(`❌ Ferry simulation failed: ${error.message}`);
                }
            } else {
                addOutput('❌ Cannot simulate - BroadcastSessionTracker not available');
            }
        }
        
        async function checkFirebase() {
            addOutput('🔥 Checking Firebase status...');
            
            if (typeof firebase !== 'undefined') {
                addOutput('✅ Firebase SDK loaded');
                
                if (typeof firebaseConfig !== 'undefined') {
                    addOutput('✅ Firebase config loaded');
                    
                    if (firebaseConfig.isReady()) {
                        addOutput('✅ Firebase connected and ready');
                        
                        // Test direct Firebase access
                        try {
                            const db = firebaseConfig.getDatabase();
                            const sessionsRef = db.ref('sessions');
                            const snapshot = await sessionsRef.once('value');
                            const sessionsData = snapshot.val() || {};
                            
                            addOutput(`📊 Firebase sessions count: ${Object.keys(sessionsData).length}`);
                            
                            Object.entries(sessionsData).forEach(([sessionId, session]) => {
                                addOutput(`- ${session.email} (${session.role}) - Last seen: ${new Date(session.lastSeen).toLocaleTimeString()}`);
                            });
                            
                        } catch (error) {
                            addOutput(`❌ Firebase database access failed: ${error.message}`);
                        }
                    } else {
                        addOutput('❌ Firebase not ready');
                    }
                } else {
                    addOutput('❌ Firebase config not loaded');
                }
            } else {
                addOutput('❌ Firebase SDK not loaded');
            }
        }
        
        function clearAllSessions() {
            addOutput('🧹 Clearing all sessions...');
            
            // Clear localStorage sessions
            const keys = Object.keys(localStorage);
            let cleared = 0;
            
            keys.forEach(key => {
                if (key.startsWith('session_') || key === 'globalSessionList') {
                    localStorage.removeItem(key);
                    cleared++;
                }
            });
            
            addOutput(`✅ Cleared ${cleared} localStorage sessions`);
            
            // Clear Firebase sessions (if available)
            if (typeof firebaseConfig !== 'undefined' && firebaseConfig.isReady()) {
                try {
                    const db = firebaseConfig.getDatabase();
                    db.ref('sessions').remove();
                    addOutput('✅ Cleared Firebase sessions');
                } catch (error) {
                    addOutput(`❌ Failed to clear Firebase sessions: ${error.message}`);
                }
            }
        }
        
        // Auto-run on load
        window.addEventListener('load', function() {
            addOutput('🚀 Session Test Tool loaded');
            setTimeout(checkAllSessions, 1000);
        });
    </script>
</body>
</html>
