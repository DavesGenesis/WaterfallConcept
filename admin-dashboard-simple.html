<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Security Monitoring</title>
    
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <script src="config-advanced.js"></script>
    <script src="broadcast-session-tracker.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            background: #0a192f;
            color: #64ffda;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #172a46;
            border-radius: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #172a46;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #64ffda;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #64ffda;
        }
        .stat-label {
            font-size: 0.9rem;
            color: #8892b0;
            margin-top: 5px;
        }
        .panel {
            background: #172a46;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #64ffda;
        }
        .panel-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #64ffda;
        }
        .btn {
            background: #64ffda;
            color: #0a192f;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
        }
        .btn:hover {
            background: #4fd1c7;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .session-item {
            background: #1e3a5f;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #64ffda;
        }
        .session-email {
            font-weight: bold;
            color: #64ffda;
        }
        .session-details {
            font-size: 0.9rem;
            color: #8892b0;
            margin-top: 5px;
        }
        .session-id {
            font-size: 0.75rem;
            color: #4a5568;
            font-family: monospace;
        }
        .debug-output {
            background: #1e3a5f;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .firebase-mode {
            background: #10b981;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            display: inline-block;
            margin-left: 10px;
        }
        .localStorage-mode {
            background: #f59e0b;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            display: inline-block;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i class="fas fa-shield-alt"></i> Security Dashboard
                <span id="modeIndicator"></span>
            </h1>
            <div>
                <button class="btn" onclick="refreshSessions()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
                <button class="btn" onclick="debugSessions()">
                    <i class="fas fa-bug"></i> Debug
                </button>
                <button class="btn btn-danger" onclick="cleanupExpired()">
                    <i class="fas fa-trash"></i> Clean Expired
                </button>
                <button class="btn" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> Back to Tool
                </button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="activeSessionsCount">0</div>
                <div class="stat-label">FIREBASE SESSIONS</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="localStorageCount">0</div>
                <div class="stat-label">LOCALSTORAGE SESSIONS</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="uniqueUsersCount">0</div>
                <div class="stat-label">UNIQUE USERS</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="lastUpdate">--:--</div>
                <div class="stat-label">LAST UPDATE</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">
                <i class="fas fa-users"></i> Active Sessions
            </div>
            <div id="sessionsList">
                <p style="text-align: center; color: #8892b0;">Loading sessions...</p>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">
                <i class="fas fa-terminal"></i> Debug Output
            </div>
            <div id="debugOutput" class="debug-output">
                Dashboard loaded. Click Debug to run diagnostics.
            </div>
        </div>
    </div>

    <script>
        let debugMessages = [];
        let firebaseEnabled = false;

        function addDebugMessage(message) {
            const timestamp = new Date().toLocaleTimeString();
            debugMessages.push(`[${timestamp}] ${message}`);
            
            if (debugMessages.length > 30) {
                debugMessages = debugMessages.slice(-30);
            }
            
            document.getElementById('debugOutput').textContent = debugMessages.join('\n');
        }

        function updateStats(firebaseCount, localCount, uniqueUsers) {
            document.getElementById('activeSessionsCount').textContent = firebaseCount;
            document.getElementById('localStorageCount').textContent = localCount;
            document.getElementById('uniqueUsersCount').textContent = uniqueUsers;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        }

        function displaySessions(sessions) {
            const container = document.getElementById('sessionsList');
            
            if (sessions.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #8892b0;">No active sessions found</p>';
                return;
            }

            container.innerHTML = sessions.map(session => {
                const lastSeenDate = new Date(session.lastSeen);
                const ageMinutes = Math.floor((Date.now() - session.lastSeen) / 60000);
                const ageDisplay = ageMinutes < 1 ? 'Just now' : 
                                  ageMinutes < 60 ? `${ageMinutes}m ago` : 
                                  `${Math.floor(ageMinutes / 60)}h ${ageMinutes % 60}m ago`;
                
                return `
                    <div class="session-item">
                        <div class="session-email">
                            ${session.email} 
                            <span style="color: #8892b0; font-size: 0.8rem;">(${session.role || 'Unknown'})</span>
                        </div>
                        <div class="session-details">
                            Device: ${session.deviceName || 'Unknown'} | 
                            Browser: ${session.browser || 'Unknown'} | 
                            Last seen: ${ageDisplay}
                        </div>
                        <div class="session-id">
                            ID: ${session.id || 'Unknown'} | 
                            Fingerprint: ${session.deviceFingerprint || 'Unknown'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getLocalStorageSessions() {
            const sessions = [];
            const sessionTimeout = 30 * 60 * 1000; // 30 minutes
            
            try {
                // Check global session list
                const globalList = localStorage.getItem('globalSessionList');
                if (globalList) {
                    const data = JSON.parse(globalList);
                    const validSessions = (data.sessions || []).filter(session => {
                        return session && session.lastSeen && 
                               (Date.now() - session.lastSeen < sessionTimeout);
                    });
                    sessions.push(...validSessions);
                }
                
                // Check individual session keys
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith('session_')) {
                        try {
                            const session = JSON.parse(localStorage.getItem(key));
                            if (session && session.lastSeen && 
                                (Date.now() - session.lastSeen < sessionTimeout)) {
                                // Avoid duplicates by ID
                                if (!sessions.find(s => s.id === session.id)) {
                                    sessions.push(session);
                                }
                            }
                        } catch (e) {
                            addDebugMessage(`Error parsing session: ${key}`);
                        }
                    }
                }
            } catch (error) {
                addDebugMessage(`LocalStorage error: ${error.message}`);
            }
            
            return sessions;
        }

        // ✅ FIXED: Direct Firebase access like firebase-cleanup.html
        async function getFirebaseSessions() {
            try {
                // ✅ FIX 1: Check if Firebase is ready
                if (typeof firebaseConfig === 'undefined') {
                    addDebugMessage('❌ Firebase config not loaded');
                    return [];
                }

                if (!firebaseConfig.isReady()) {
                    addDebugMessage('⏳ Firebase not ready, initializing...');
                    await firebaseConfig.initialize();
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }

                // ✅ FIX 2: Direct Firebase access (like firebase-cleanup.html)
                const db = firebaseConfig.getDatabase();
                const sessionsRef = db.ref('sessions');
                const snapshot = await sessionsRef.once('value');
                const sessionsData = snapshot.val() || {};
                
                // ✅ FIX 3: Convert to array and filter active sessions
                const sessionTimeout = 30 * 60 * 1000; // 30 minutes
                const sessions = Object.entries(sessionsData)
                    .map(([id, session]) => ({
                        ...session,
                        id: id // Ensure ID is included
                    }))
                    .filter(session => {
                        return session.lastSeen && 
                               (Date.now() - session.lastSeen < sessionTimeout);
                    });
                
                addDebugMessage(`✅ Firebase: Retrieved ${sessions.length} active sessions`);
                firebaseEnabled = true;
                
                return sessions;
                
            } catch (error) {
                addDebugMessage(`❌ Firebase error: ${error.message}`);
                firebaseEnabled = false;
                return [];
            }
        }

        async function refreshSessions() {
            addDebugMessage('🔄 Refreshing sessions...');
            
            try {
                // Get sessions from both sources
                const firebaseSessions = await getFirebaseSessions();
                const localSessions = getLocalStorageSessions();
                
                // ✅ FIX 4: Combine WITHOUT deduplication to show ALL sessions
                const allSessions = [...firebaseSessions];
                
                // Add local sessions that aren't in Firebase
                localSessions.forEach(localSession => {
                    if (!allSessions.find(s => s.id === localSession.id)) {
                        allSessions.push(localSession);
                    }
                });
                
                // Count unique users
                const uniqueUsers = new Set(allSessions.map(s => s.email)).size;
                
                // Update display
                updateStats(firebaseSessions.length, localSessions.length, uniqueUsers);
                displaySessions(allSessions);
                
                // Update mode indicator
                const modeIndicator = document.getElementById('modeIndicator');
                if (firebaseEnabled) {
                    modeIndicator.innerHTML = '<span class="firebase-mode">Firebase Mode</span>';
                } else {
                    modeIndicator.innerHTML = '<span class="localStorage-mode">LocalStorage Mode</span>';
                }
                
                addDebugMessage(`✅ Total: ${allSessions.length} sessions (${firebaseSessions.length} firebase, ${localSessions.length} local)`);
                addDebugMessage(`✅ Unique users: ${uniqueUsers}`);
                
            } catch (error) {
                addDebugMessage(`❌ Refresh failed: ${error.message}`);
            }
        }

        async function debugSessions() {
            addDebugMessage('🛠️ === DEBUG SESSIONS ===');
            
            try {
                // Check script loading
                addDebugMessage(`Firebase SDK: ${typeof firebase !== 'undefined' ? '✅' : '❌'}`);
                addDebugMessage(`Firebase Config: ${typeof firebaseConfig !== 'undefined' ? '✅' : '❌'}`);
                addDebugMessage(`Session Tracker: ${typeof BroadcastSessionTracker !== 'undefined' ? '✅' : '❌'}`);
                
                if (typeof firebaseConfig !== 'undefined') {
                    addDebugMessage(`Firebase Ready: ${firebaseConfig.isReady() ? '✅' : '❌'}`);
                }
                
                // Test localStorage
                const localSessions = getLocalStorageSessions();
                addDebugMessage(`LocalStorage sessions: ${localSessions.length}`);
                if (localSessions.length > 0) {
                    localSessions.forEach((s, i) => {
                        addDebugMessage(`  ${i + 1}. ${s.email} (${s.id})`);
                    });
                }
                
                // Test Firebase
                const firebaseSessions = await getFirebaseSessions();
                addDebugMessage(`Firebase sessions: ${firebaseSessions.length}`);
                if (firebaseSessions.length > 0) {
                    firebaseSessions.forEach((s, i) => {
                        addDebugMessage(`  ${i + 1}. ${s.email} (${s.id})`);
                    });
                }
                
                // Show current authentication
                const authData = JSON.parse(sessionStorage.getItem('waterfallAuth') || '{}');
                addDebugMessage(`Current user: ${authData.email || 'Not logged in'} (${authData.role || 'No role'})`);
                
                addDebugMessage('=== DEBUG COMPLETE ===');
                
                // Refresh display
                await refreshSessions();
                
            } catch (error) {
                addDebugMessage(`❌ Debug failed: ${error.message}`);
            }
        }

        async function cleanupExpired() {
            if (!confirm('Remove all expired sessions from Firebase?')) {
                return;
            }
            
            addDebugMessage('🧹 Cleaning expired sessions...');
            
            try {
                if (!firebaseConfig.isReady()) {
                    await firebaseConfig.initialize();
                }
                
                const db = firebaseConfig.getDatabase();
                const sessionsRef = db.ref('sessions');
                const snapshot = await sessionsRef.once('value');
                const sessionsData = snapshot.val() || {};
                
                const now = Date.now();
                const sessionTimeout = 30 * 60 * 1000;
                let cleaned = 0;
                
                for (const [sessionId, session] of Object.entries(sessionsData)) {
                    const isExpired = !session.lastSeen || (now - session.lastSeen > sessionTimeout);
                    
                    if (isExpired) {
                        await db.ref(`sessions/${sessionId}`).remove();
                        addDebugMessage(`🗑️ Removed: ${session.email || 'Unknown'}`);
                        cleaned++;
                    }
                }
                
                addDebugMessage(`✅ Cleaned ${cleaned} expired sessions`);
                
                setTimeout(refreshSessions, 1000);
                
            } catch (error) {
                addDebugMessage(`❌ Cleanup failed: ${error.message}`);
            }
        }

        function goBack() {
            window.location.href = 'waterfallconcept44.html';
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            addDebugMessage('🚀 Admin Dashboard loaded');
            
            // Auto-refresh every 15 seconds (more frequent than before)
            setInterval(refreshSessions, 15000);
            
            // Initial load with delay
            setTimeout(refreshSessions, 2000);
        });
    </script>
</body>
</html>
